services:
  api:
    container_name: VizionerAPI
    build:
      context: .
      dockerfile: api/Dockerfile
    image: vizioner-api
    volumes:
      - ./models:/models:ro
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    depends_on:
      - broker
    restart: always

  worker:
    container_name: VizionerWorker
    build:
      context: .
      dockerfile: worker/Dockerfile
    image: vizioner-worker
    volumes:
      - ./models:/models:ro
      - ./tempfiles:/tempfiles
    env_file:
      - ./.env
    depends_on:
      - broker
    restart: always
    mem_limit: 120g
    shm_size: 16g
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      PYTORCH_CUDA_ALLOC_CONF: max_split_size_mb:512
    ulimits:
      memlock:
        soft: -1
        hard: -1

  broker:
    container_name: VizionerBroker
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    restart: always

  content:
    container_name: VizionerContent
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    env_file:
      - ./.env
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - content-data:/data
    restart: always

volumes:
  content-data:
